name: Build and Publish Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag details
        id: image_vars
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          REPO_LOWER=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')

          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_LOWER=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')

          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/${REPO_LOWER}"
          IMAGE_TAG="${TAG_LOWER}_${SHORT_SHA}_${GITHUB_RUN_NUMBER}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "Final image will be: ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          docker build \
            -f ./Dockerfile \
            --label commitHash=$(git rev-parse --short HEAD) \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: List Docker images
        run: docker images

      - name: Push Docker image
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"