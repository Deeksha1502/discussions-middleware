name: Build and Publish Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare Docker image name and tag
        run: |
          ORG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          TAG_NAME=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')
          BUILD_TAG="${TAG_NAME}_${{ steps.vars.outputs.commit_hash }}_${GITHUB_RUN_NUMBER}"
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$BUILD_TAG" >> $GITHUB_ENV
          echo "Final Image: $ORG/discussion-middleware:$BUILD_TAG"

      - name: Build Docker image using build.sh
        run: |
          chmod +x build.sh
          /bin/bash build.sh "${IMAGE_TAG}" "${{ runner.name }}" "${ORG}"

      - name: List Docker images (debug)
        run: docker images

      - name: Push Docker image
        run: docker push "${ORG}/discussion-middleware:${IMAGE_TAG}"