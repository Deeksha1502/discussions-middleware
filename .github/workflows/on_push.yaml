name: Build and Publish Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag details
        id: image_vars
        run: |
          # Create lowercase repo path (ghcr.io/<owner>/<repo>)
          REPO_PATH=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_PATH}"

          # Use the pushed git tag as the main image version
          IMAGE_TAG_VERSION="${GITHUB_REF_NAME}"

          # Short commit SHA for secondary tagging
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Create multi-line tag list for Docker buildx
          FULL_TAGS="${IMAGE_NAME}:${IMAGE_TAG_VERSION}${IMAGE_NAME}:${SHORT_SHA}"

          # Export outputs for next step
          echo "DOCKER_TAGS=${FULL_TAGS}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "Image will be tagged as:"
          echo "${FULL_TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          labels: commitHash=${{ steps.image_vars.outputs.SHORT_SHA }}
          push: true
          tags: ${{ steps.image_vars.outputs.DOCKER_TAGS }}
