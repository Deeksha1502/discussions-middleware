name: Build and Publish Docker Image

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare Docker image name and tag
        run: |
          REPO_NAME_LOWERCASE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          TAG_NAME=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')
          BUILD_TAG="${TAG_NAME}_${{ steps.vars.outputs.commit_hash }}_${GITHUB_RUN_NUMBER}"
          ORG="ghcr.io/${REPO_NAME_LOWERCASE%/*}"

          echo "ORG=${ORG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${BUILD_TAG}" >> $GITHUB_ENV

      - name: Build Docker image using build.sh
        run: |
          chmod 777 build.sh
          /bin/bash build.sh ${{ env.IMAGE_TAG }} ${{ runner.name }} ${{ env.ORG }}

      - name: Push Docker image
        run: docker push ${{ env.ORG }}/discussion-middleware:${{ env.IMAGE_TAG }}
      
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: metadata.json
          retention-days: 30